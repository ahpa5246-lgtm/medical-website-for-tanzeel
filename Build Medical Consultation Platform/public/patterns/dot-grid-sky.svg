<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" aria-hidden="true">
  <!-- Subtle custom dot grid for Tanzeel, reference: svgbackgrounds.com/tools/dot-grids/ -->
  <defs>
    <pattern id="sky-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.3" fill="#67a9c9" opacity=".64"/>
    </pattern>
  </defs>
  <rect width="240" height="240" fill="url(#sky-dots)"/>
</svg>
