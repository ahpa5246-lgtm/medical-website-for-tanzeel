name: One-shot licensed portrait optimization
on:
  push:
    branches: [feat/tanzeel-warm-doodle-redesign-20261030]
    paths: [".github/workflows/portrait-assets.yml"]
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch three Pexels-licensed source photographs
        shell: bash
        run: |
          set -euo pipefail
          root="Build Medical Consultation Platform/public/images"
          mkdir -p "$root"
          curl -fLsS --retry 3 --max-time 50 "https://images.pexels.com/photos/8376309/pexels-photo-8376309.jpeg?auto=compress&cs=tinysrgb&w=850" -o "$root/medical-consultation.jpg"
          curl -fLsS --retry 3 --max-time 50 "https://images.pexels.com/photos/19438562/pexels-photo-19438562.jpeg?auto=compress&cs=tinysrgb&w=850" -o "$root/medical-directory.jpg"
          curl -fLsS --retry 3 --max-time 50 "https://images.pexels.com/photos/19131214/pexels-photo-19131214.jpeg?auto=compress&cs=tinysrgb&w=850" -o "$root/medical-training.jpg"
          for item in "$root/"*.jpg; do
            test "$(file --brief --mime-type "$item")" = "image/jpeg"
            test "$(wc -c < "$item")" -gt 7000
            test "$(wc -c < "$item")" -lt 700000
          done
      - name: Commit local stock photos on design branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --renormalize -f "Build Medical Consultation Platform/public/images/"
          git diff --cached --quiet || (git commit -m "assets: bundle licensed doctor photos for reliable home cards" && git push origin HEAD:refs/heads/feat/tanzeel-warm-doodle-redesign-20261030)
