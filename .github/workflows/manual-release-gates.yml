name: Manual Staging Release Gates

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized staging URL to test, including https://"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Passive security scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true

  k6-smoke:
    name: k6 load smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load smoke test
        uses: grafana/k6-action@v0.3.1
        env:
          BASE_URL: ${{ inputs.target_url }}
        with:
          filename: tests/load/medical-smoke.js
