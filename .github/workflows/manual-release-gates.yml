name: Manual Staging Release Gates

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized staging URL to test, including https://"
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Passive security scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true

  k6-smoke:
    name: k6 load smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
      - name: Load smoke test
        uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1
        env:
          BASE_URL: ${{ inputs.target_url }}
        with:
          path: tests/load/medical-smoke.js
