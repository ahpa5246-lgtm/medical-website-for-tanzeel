name: One-shot Editorial Formatting

on:
  push:
    branches: [feat/tanzeel-warm-doodle-redesign-20261030]
    paths:
      - ".github/workflows/editorial-format.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format site and tests using pinned oxfmt
        run: pnpm format .
      - name: Commit exact formatting without bypassing CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "style: apply pinned oxfmt to editorial redesign" && git push origin HEAD:refs/heads/feat/tanzeel-warm-doodle-redesign-20261030)
