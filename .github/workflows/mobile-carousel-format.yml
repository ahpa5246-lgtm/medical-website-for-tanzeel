name: One-shot Mobile Carousel Formatting
on:
  push:
    branches: [feat/tanzeel-warm-doodle-redesign-20261030]
    paths: [".github/workflows/mobile-carousel-format.yml"]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format .
      - name: Commit checked formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || (git commit -m "style: format responsive mobile service carousel" && git push origin HEAD:refs/heads/feat/tanzeel-warm-doodle-redesign-20261030)
