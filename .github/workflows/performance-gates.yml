name: Browser and Performance Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "Build Medical Consultation Platform/**"
      - ".github/workflows/performance-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install exact CI-only browser and bundle tools
        run: >
          pnpm add -D
          @playwright/test@1.63.0
          size-limit@14.0.0
          @size-limit/file@14.0.0
          --lockfile=false

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm exec playwright test -c playwright.config.mjs

      - name: Enforce JavaScript transfer budget
        run: pnpm exec size-limit

      - name: Run Lighthouse CI
        run: npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: "Build Medical Consultation Platform/playwright-report"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-report
          path: "Build Medical Consultation Platform/lhci_reports"
          if-no-files-found: ignore
          retention-days: 7
