name: Browser and Performance Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "Build Medical Consultation Platform/**"
      - ".github/workflows/performance-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: npx -y @playwright/test@1.63.0 install --with-deps chromium

      - name: Run browser smoke tests
        run: npx -y @playwright/test@1.63.0 test -c playwright.config.mjs

      - name: Enforce JavaScript transfer budget
        run: >
          npx -y
          -p size-limit@14.0.0
          -p @size-limit/file@14.0.0
          size-limit --limit "400 kB" "dist/assets/*.js"

      - name: Run Lighthouse CI
        run: npx -y @lhci/cli@0.15.x autorun --config=lighthouserc.cjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: "Build Medical Consultation Platform/playwright-report"
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: "Build Medical Consultation Platform/lhci_reports"
          if-no-files-found: ignore
          retention-days: 7
