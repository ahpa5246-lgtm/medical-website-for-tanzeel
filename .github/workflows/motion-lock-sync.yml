name: One-shot Motion Lock Sync
on:
  push:
    branches: [feat/tanzeel-warm-doodle-redesign-20261030]
    paths: [".github/workflows/motion-lock-sync.yml"]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit resolved exact dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || (git commit -m "build: lock Motion dependency" && git push origin HEAD:refs/heads/feat/tanzeel-warm-doodle-redesign-20261030)
