name: Medical Prototype CI

on:
  pull_request:
    paths:
      - "Build Medical Consultation Platform/**"
      - "supabase/**"
      - ".github/workflows/medical-prototype-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-prototype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prototype safety tests
        run: pnpm test

      - name: Type-check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Build production bundle
        run: pnpm build
