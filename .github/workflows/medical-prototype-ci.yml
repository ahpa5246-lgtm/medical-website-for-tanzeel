name: Medical Prototype CI

on:
  pull_request:
    paths:
      - "Build Medical Consultation Platform/**"
      - "supabase/**"
      - ".github/workflows/medical-prototype-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medical-prototype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply formatter on production-consultations
        if: github.event_name == 'pull_request' && github.head_ref == 'production-consultations'
        run: |
          pnpm format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply oxfmt"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run prototype safety tests
        run: pnpm test

      - name: Type-check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Build production bundle
        run: pnpm build

  quota-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prove server quota across refresh and a second tab
        env:
          PGPASSWORD: postgres
        run: >-
          docker run --rm --network host
          -v "$PWD:/workspace" -w /workspace
          -e PGPASSWORD
          postgres:16-alpine
          psql --host 127.0.0.1 --username postgres --dbname postgres
          --set ON_ERROR_STOP=1
          --file supabase/tests/learning_lab_quota.integration.sql
