name: Medical Prototype CI

on:
  pull_request:
    paths:
      - "Build Medical Consultation Platform/**"
      - ".github/workflows/medical-prototype-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-prototype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prototype safety tests
        run: pnpm test

      - name: Type-check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Build production bundle
        run: pnpm build
