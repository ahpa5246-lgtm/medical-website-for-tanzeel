name: Design Dependency Lock Resolver

on:
  push:
    branches: [feat/tanzeel-warm-doodle-redesign-20261030]
    paths:
      - "Build Medical Consultation Platform/package.json"
      - ".github/workflows/design-dependency-lock.yml"

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: corepack enable
      - name: Resolve pinned package versions without changing manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: editorial-redesign-pnpm-lock
          path: "Build Medical Consultation Platform/pnpm-lock.yaml"
          retention-days: 2
