name: Temporary format hardening branch

on:
  pull_request:
    types: [synchronize, opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/medical-production-hardening-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "Build Medical Consultation Platform"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt src/features/auth/AuthProvider.tsx src/pages/auth/AcceptInvitation.tsx src/pages/auth/Login.tsx src/pages/auth/UpdatePassword.tsx src/pages/consultations/Submit.tsx tests/e2e/smoke.spec.mjs tests/medical-hardening-contract.test.mjs
      - name: Commit only formatter-generated edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/AuthProvider.tsx src/pages/auth/AcceptInvitation.tsx src/pages/auth/Login.tsx src/pages/auth/UpdatePassword.tsx src/pages/consultations/Submit.tsx tests/e2e/smoke.spec.mjs tests/medical-hardening-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Apply oxfmt to medical hardening changes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
