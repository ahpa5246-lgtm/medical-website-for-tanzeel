name: Supabase Database Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.117.0

      - name: Initialize local Supabase config when absent
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start local Supabase stack and replay migrations
        run: supabase start

      - name: Run consultation RLS pgTAP tests
        run: supabase test db supabase/tests/database/consultations_rls.test.sql

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup || true
