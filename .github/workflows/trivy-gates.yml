name: Trivy Repository Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install verified Trivy release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Scan runtime and development dependencies, secrets, and configuration
        run: >
          "$RUNNER_TEMP/trivy" fs --exit-code 1 --include-dev-deps
          --scanners vuln,misconfig,secret --severity HIGH,CRITICAL
          --skip-dirs node_modules --skip-dirs .git --skip-dirs dist .
